<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shena · Portfolio</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @custom-variant dark (&:where(.dark, .dark *));

        @layer components {
            .btn-primary {
                @apply px-5 py-2 rounded-full font-semibold bg-black text-fuchsia-200
                       hover:bg-fuchsia-700 hover:text-white backdrop-blur-md
                       border border-black/50 transition-colors;
            }
            .btn-secondary {
                @apply px-5 py-2 rounded-full font-medium bg-black text-pink-200
                       hover:bg-fuchsia-700 hover:text-white backdrop-blur-md
                       border border-pink-300/40 transition-colors;
            }
            .btn-accent {
                @apply px-5 py-2 rounded-full font-medium bg-black text-pink-200
                       hover:bg-black/80 backdrop-blur-md border border-pink-300/40
                       transition-colors;
            }
            .rule {
                @apply h-px w-10 bg-black/50 dark:bg-black/70;
            }

            .glass-card {
                @apply border border-pink-300/70 bg-pink-200/70 backdrop-blur-xl
                       rounded-2xl shadow-lg
                       dark:bg-pink-900/50 dark:border-pink-400/30;
            }
        }
    </style>
</head>

<body class="bg-gradient-to-br from-fuchsia-100 via-fuchsia-200 to-fuchsia-300
           dark:from-fuchsia-950 dark:via-fuchsia-900 dark:to-fuchsia-800
           text-black dark:text-fuchsia-50 font-sans flex flex-col min-h-screen">

    <header
        class="sticky top-0 z-50 backdrop-blur-xl bg-fuchsia-800/90 dark:bg-fuchsia-950/90 border-b border-black/30">
        <div class="max-w-5xl mx-auto flex items-center justify-between px-5 py-2.5">
            <span class="text-pink-200 font-bold text-lg tracking-tight">shena2209</span>

            <nav class="hidden md:flex items-center gap-5 text-xs font-medium text-pink-100">
                <a href="#hero" class="hover:text-white transition-colors">Hero</a>
                <a href="#about" class="hover:text-white transition-colors">About</a>
                <a href="#services" class="hover:text-white transition-colors">Services</a>
                <a href="#contact" class="hover:text-white transition-colors">Contact</a>
            </nav>

            <button id="toggleDark" class="bg-black text-pink-200 border border-pink-300/40 hover:bg-fuchsia-700 hover:text-white
                       px-4 py-1.5 rounded-full text-xs backdrop-blur-md transition-colors">
                Toggle
            </button>
        </div>
    </header>
    <div class="h-1 w-full bg-black"></div>
    <main class="flex-1">
        <section id="hero" class="flex flex-col items-center justify-center text-center px-5 py-10">
            <div class="glass-card px-8 py-10 max-w-lg mx-auto">
                <span class="inline-block px-3 py-0.5 mb-4 text-[10px] font-semibold tracking-widest uppercase rounded-full
                           bg-black text-fuchsia-200 border border-black">
                    Portfolio
                </span>
                <h1 class="text-5xl md:text-6xl font-bold text-fuchsia-700 dark:text-fuchsia-300 mb-3">Shena</h1>
                <div class="flex flex-wrap gap-3 justify-center">
                    <a href="#services" class="btn-primary">View Services</a>
                    <a href="#contact" class="btn-secondary">Contact Me</a>
                    <a href="#" class="btn-accent">Special Offer</a>
                </div>
                <div class="mt-8 flex items-center justify-center gap-2 text-[10px] font-medium tracking-wide">
                    <span class="flex items-center gap-1">
                        <span class="w-3 h-3 rounded-full bg-fuchsia-600"></span>
                    </span>
                    <span class="flex items-center gap-1">
                        <span class="w-3 h-3 rounded-full bg-pink-400"></span>
                    </span>
                    <span class="flex items-center gap-1">
                        <span class="w-3 h-3 rounded-full bg-black border border-white/30"></span>
                    </span>
                </div>
            </div>
        </section>
        <div class="flex items-center justify-center gap-3 py-4">
            <span class="rule"></span>
            <span class="text-fuchsia-700 dark:text-fuchsia-300 text-[10px] tracking-widest uppercase">About</span>
            <span class="rule"></span>
        </div>
        <section id="about" class="px-5 pb-8">
            <div class="glass-card max-w-2xl mx-auto text-center px-6 py-8">
                <h2 class="text-3xl md:text-4xl font-bold text-fuchsia-700 dark:text-fuchsia-300 mb-3">About</h2>
            </div>
        </section>
        <div class="flex items-center justify-center gap-3 py-4">
            <span class="rule"></span>
            <span class="text-fuchsia-700 dark:text-fuchsia-300 text-[10px] tracking-widest uppercase">Services</span>
            <span class="rule"></span>
        </div>
        <section id="services" class="px-5 pb-8">
            <div class="glass-card max-w-5xl mx-auto text-center px-6 py-8">
                <h2 class="text-3xl md:text-4xl font-bold text-fuchsia-700 dark:text-fuchsia-300 mb-4">Services</h2>
            </div>
        </section>
        <div class="flex items-center justify-center gap-3 py-4">
            <span class="rule"></span>
            <span class="text-fuchsia-700 dark:text-fuchsia-300 text-[10px] tracking-widest uppercase">Contact</span>
            <span class="rule"></span>
        </div>
        <section id="contact" class="px-5 pb-12">
            <div class="glass-card max-w-2xl mx-auto text-center px-6 py-8">
                <h2 class="text-3xl md:text-4xl font-bold text-fuchsia-700 dark:text-fuchsia-300 mb-3">Contact</h2>
            </div>
        </section>
    </main>

    <script>
        const tb = document.querySelector("#toggleDark");
        const html = document.querySelector('html');
        tb.addEventListener('click', function () {
            html.classList.toggle('dark');
        });
    </script>

</body>

</html>
