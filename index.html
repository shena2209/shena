<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shena · Portfolio</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @custom-variant dark (&:where(.dark, .dark *));

        @layer components {
            .btn-primary {
                  @apply px-4 py-1.5 rounded-full font-semibold bg-black text-pink-200
                      hover:bg-purple-900 hover:text-white backdrop-blur-md
                       border border-black/50 transition-colors;
            }
            .btn-secondary {
                @apply px-4 py-1.5 rounded-full font-medium bg-black text-pink-200
                       hover:bg-purple-900 hover:text-white backdrop-blur-md
                       border border-pink-300/40 transition-colors;
            }
            .btn-accent {
                @apply px-4 py-1.5 rounded-full font-medium bg-black text-pink-200
                       hover:bg-black/80 backdrop-blur-md border border-pink-300/40
                       transition-colors;
            }
            
            .btn-glass {
                @apply px-5 py-1.5 rounded-full text-xs font-semibold
                       bg-black text-white hover:bg-neutral-800
                       dark:bg-black dark:text-white dark:hover:bg-neutral-950
                       backdrop-blur-lg border border-black dark:border-neutral-800
                       shadow-[0_4px_12px_rgba(236,72,153,0.1)]
                       dark:shadow-none transition-colors duration-300;
            }

            .rule {
                @apply h-px w-10 bg-black/70 dark:bg-neutral-800;
            }

            .glass-card {
                  @apply border border-purple-400/80 bg-purple-300/80 backdrop-blur-xl
                       rounded-2xl shadow-lg
                      dark:bg-black dark:border-neutral-800
                      transition-all duration-300 hover:bg-purple-400/80 dark:hover:bg-neutral-950;
            }
        }
    </style>

    <style>
        .flip-card {
            cursor: pointer;
            user-select: none;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-pink-100 via-pink-200 to-pink-300
           dark:from-black dark:via-black dark:to-black
           text-black dark:text-neutral-100 font-sans flex flex-col min-h-screen">

    <main class="flex-1 max-w-5xl mx-auto w-full px-4 py-8 flex flex-col gap-8">

        <section class="projects text-center flex flex-col items-center gap-4">
            <h1
                class="text-4xl md:text-5xl font-extrabold text-pink-600 dark:text-neutral-100 drop-shadow-md tracking-wider">
                SHENA
            </h1>

            <div class="flex gap-3">
                <button id="toggledark" class="btn-glass">
                    Toggle
                </button>
                <button id="Replay" class="btn-glass">
                    Replay
                </button>
            </div>
        </section>

        <nav class="glass-card flex items-center justify-between px-6 py-3 rounded-full">
            <span class="text-black dark:text-neutral-200 font-bold text-sm tracking-wide">SHENA2209</span>
            <div class="hidden md:flex gap-8">
                <a href="#about"
                    class="hover:text-purple-900 dark:hover:text-white transition-colors text-xs font-medium text-black dark:text-neutral-300">About</a>
                <a href="#services"
                    class="hover:text-purple-900 dark:hover:text-white transition-colors text-xs font-medium text-black dark:text-neutral-300">Services</a>
                <a href="#contact"
                    class="hover:text-purple-900 dark:hover:text-white transition-colors text-xs font-medium text-black dark:text-neutral-300">Contact</a>
            </div>
        </nav>


        <section id="cards-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6 relative">

            <div id="about" class="glass-card flip-card p-8 flex flex-col items-center text-center">
                <h2 class="text-xl font-bold text-black dark:text-neutral-100 mb-1">About </h2>
                <div class="w-10 h-1 bg-pink-700 dark:bg-neutral-300 rounded-full mb-4"></div>
                <p class="text-sm text-black/80 dark:text-neutral-300 leading-relaxed">
                    OKAY NANI SIRRRRR
                </p>
            </div>

            <div id="services" class="glass-card flip-card p-8 flex flex-col items-center text-center">
                <h2 class="text-xl font-bold text-black dark:text-neutral-100 mb-1">Services</h2>
                <div class="w-10 h-1 bg-pink-700 dark:bg-neutral-300 rounded-full mb-4"></div>
                <p class="text-sm text-black/80 dark:text-neutral-300 leading-relaxed">
                    SERVICE NA NEMO
                </p>
            </div>

            <div id="contact" class="glass-card flip-card p-8 flex flex-col items-center text-center">
                <h2 class="text-xl font-bold text-black dark:text-neutral-100 mb-1">Contact</h2>
                <div class="w-10 h-1 bg-pink-700 dark:bg-neutral-300 rounded-full mb-4"></div>
                <p class="text-sm text-black/80 dark:text-neutral-300 leading-relaxed">
                    CONTACT ME NA SIRRRRR
                </p>
            </div>
        </section>

    </main>

    <script>
        const tb = document.querySelector("#toggledark");
        const html = document.querySelector('html');
        tb.addEventListener('click', function () {
            html.classList.toggle('dark');
        });
    </script>


    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Flip.min.js"></script>

    <script>
        console.log("gsap ver", gsap.version);

        gsap.registerPlugin(Flip);

        let toggleTurns = 0;
        const tl = gsap.timeline({ defaults: { duration: 0.8, ease: "power2.out", clearProps: "all" } });
        tl.from("h1", { y: -20, opacity: 0, duration: 0.8, ease: "back.out(2.5)" });
        tl.from("nav", { y: 60, opacity: 0, duration: 0.8, ease: "power2.out", stagger: 0.5 });
        tl.from("#about", { y: 60, opacity: 0, duration: 0.8, ease: "elastic.out(1.03)" });
        tl.from("#services", { y: 60, opacity: 0, duration: 0.8, ease: "elastic.out(1.03)" });
        tl.from("#contact", { y: 60, opacity: 0, duration: 0.8, ease: "elastic.out(1.03)" });

        document.querySelector("#toggledark").addEventListener("click", () => {
            toggleTurns += 1;
            gsap.to("#toggledark", {
                rotation: toggleTurns * 360,
                duration: 0.8,
                ease: "power2.inOut",
                overwrite: "auto"
            });
        });
        document.querySelector("#Replay").addEventListener("click", () => tl.restart());

        const cardsGrid = document.querySelector("#cards-grid");
        const flipCards = document.querySelectorAll('.flip-card');

        flipCards.forEach(card => {
            card.addEventListener('click', () => {
                const state = Flip.getState(flipCards);
                cardsGrid.prepend(card);
                Flip.from(state, {
                    duration: 0.6,
                    ease: "power2.inOut",
                    absolute: true,
                    stagger: 0.05
                });
            });
        });
    </script>

</body>

</html>
